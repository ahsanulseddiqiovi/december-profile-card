<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ডিসেম্বর ফটোকার্ড | Political Banner</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#130b10;color:#fff;font-family:'Hind Siliguri',sans-serif}.shell{max-width:1150px;margin:auto;padding:24px 14px 50px}h1{text-align:center;font-size:clamp(24px,4vw,36px);margin:0}.sub{text-align:center;color:#ddd;margin:0 0 22px}.layout{display:grid;grid-template-columns:minmax(0,680px) minmax(280px,1fr);gap:24px;align-items:start}.preview,.tools{border:1px solid #58333b;background:#24141c;border-radius:18px;padding:14px;box-shadow:0 14px 35px #0006}canvas{width:100%;height:auto;display:block;border-radius:10px;touch-action:none;cursor:grab}.tools{display:grid;gap:14px}.tools h2{margin:0}.btn{background:#d20c23;color:white;border:0;border-radius:10px;padding:12px;font:700 16px 'Hind Siliguri',sans-serif;cursor:pointer;text-align:center;width:100%;display:block}.btn.alt{background:#4a3440}.file{display:none}label.range{display:grid;gap:5px;font-weight:600}input[type=range]{width:100%;accent-color:#f0273a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:14px;color:#d6c4ca}.status{min-height:20px;font-size:14px;color:#ffe1a1}@media(max-width:880px){.layout{grid-template-columns:1fr}.preview,.tools{max-width:680px;width:100%;margin:auto}}</style></head><body><main class="shell"><h1>ডিসেম্বর প্রোফাইল ফটোকার্ড</h1><p class="sub">নিজের ছবি দিয়ে রাজনৈতিক ব্যানার ফ্রেম তৈরি করুন</p><div class="layout"><section class="preview"><canvas id="card" width="1080" height="1080" aria-label="কার্ড প্রিভিউ"></canvas></section><section class="tools"><h2>ছবি তৈরি করুন</h2><label class="btn" for="photo">📷 ছবি আপলোড / পরিবর্তন</label><input id="photo" class="file" type="file" accept="image/*"><p class="note">ছবিটি গোল ফ্রেমের মধ্যে টেনে সরান। দুই পাশের নেতাদের ছবি ও ব্যানারের লেখা স্থায়ী থাকবে।</p><label class="range">জুম / ক্রপ<input id="zoom" type="range" min="1" max="3" value="1" step="0.01"></label><label class="range">উজ্জ্বলতা<input id="brightness" type="range" min="50" max="150" value="100"></label><label class="range">কনট্রাস্ট<input id="contrast" type="range" min="50" max="150" value="100"></label><div class="actions"><button class="btn alt" id="reset">রিসেট</button><button class="btn alt" id="recenter">ছবি মাঝখানে</button></div><button class="btn" id="download">⬇ PNG ডাউনলোড</button><div class="status" id="status" role="status"></div></section></div></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d'),W=1080,H=1080;
const user={img:null,zoom:1,dx:0,dy:0,bright:100,contrast:100};const leaders={};let dragging=false,last=null;
const status=s=>document.getElementById('status').textContent=s;
function imageLoad(src,key){const im=new Image();im.onload=()=>{leaders[key]=im;draw()};im.onerror=()=>status('নেতাদের ছবি লোড হয়নি। assets ফোল্ডার পরীক্ষা করুন।');im.src=src}imageLoad('assets/left.png','left');imageLoad('assets/right.png','right');
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(t,x,y,size,color,stroke){ctx.save();ctx.font=`800 ${size}px 'Hind Siliguri',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=8;ctx.strokeText(t,x,y)}ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#8a0013');bg.addColorStop(.42,'#e20c20');bg.addColorStop(1,'#75000c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// Decorative coded light, rays, and geometric banner shapes
for(let i=0;i<14;i++){ctx.save();ctx.translate(540,500);ctx.rotate(i*Math.PI/7);ctx.fillStyle=i%2?'#ffffff09':'#30000012';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-85,-900);ctx.lineTo(85,-900);ctx.fill();ctx.restore()}
let shine=ctx.createRadialGradient(540,440,60,540,440,650);shine.addColorStop(0,'#ff7a4344');shine.addColorStop(1,'#00000000');ctx.fillStyle=shine;ctx.fillRect(0,0,W,H);
// Tricolor swooshes, all code drawn
ctx.beginPath();ctx.moveTo(0,575);ctx.bezierCurveTo(310,645,680,505,1080,585);ctx.lineTo(1080,660);ctx.bezierCurveTo(750,585,340,720,0,655);ctx.closePath();ctx.fillStyle='#005d36';ctx.fill();ctx.beginPath();ctx.moveTo(0,645);ctx.bezierCurveTo(340,715,740,570,1080,650);ctx.lineTo(1080,670);ctx.bezierCurveTo(750,600,340,745,0,680);ctx.closePath();ctx.fillStyle='#f9fafb';ctx.fill();
// leaders: only images; all frame graphics are canvas code
if(leaders.left){ctx.drawImage(leaders.left,18,18,325,315)}if(leaders.right){ctx.save();ctx.beginPath();ctx.roundRect(738,18,325,315,28);ctx.clip();ctx.drawImage(leaders.right,738,18,325,315);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=5;rounded(738,18,325,315,28);ctx.stroke()}
// Top title panel
let bar=ctx.createLinearGradient(360,0,720,0);bar.addColorStop(0,'#004727');bar.addColorStop(.5,'#087844');bar.addColorStop(1,'#004727');ctx.fillStyle=bar;rounded(350,35,380,238,26);ctx.fill();ctx.strokeStyle='#f5c34c';ctx.lineWidth=5;rounded(350,35,380,238,26);ctx.stroke();text('জয় বাংলা',540,108,68,'#ffffff','#083e25');text('জয় বঙ্গবন্ধু',540,205,62,'#ffdb46','#6c0000');
// Profile circle
const cx=540,cy=620,r=280;ctx.save();ctx.shadowColor='#ffdf73';ctx.shadowBlur=35;ctx.fillStyle='#ffdc65';ctx.beginPath();ctx.arc(cx,cy,r+18,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx,cy,r+11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b70b20';ctx.beginPath();ctx.arc(cx,cy,r+5,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#fff4ed';ctx.fillRect(cx-r,cy-r,r*2,r*2);if(user.img){const im=user.img,scale=Math.max(2*r/im.width,2*r/im.height)*user.zoom;ctx.filter=`brightness(${user.bright}%) contrast(${user.contrast}%)`;ctx.drawImage(im,cx-im.width*scale/2+user.dx,cy-im.height*scale/2+user.dy,im.width*scale,im.height*scale);ctx.filter='none'}else{text('এখানে আপনার',cx,cy-35,42,'#8b1c2b');text('ছবি আপলোড করুন',cx,cy+28,42,'#8b1c2b')}ctx.restore();
// Bottom ribbon
const red=ctx.createLinearGradient(0,920,0,1080);red.addColorStop(0,'#e42a2a');red.addColorStop(1,'#710010');ctx.fillStyle=red;rounded(95,920,890,145,26);ctx.fill();ctx.strokeStyle='#f5cc61';ctx.lineWidth=5;rounded(95,920,890,145,26);ctx.stroke();text('অপেক্ষার নাম — শেখ হাসিনা',540,995,67,'#ffffff','#650013');}
function pos(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
canvas.addEventListener('pointerdown',e=>{if(!user.img)return;const p=pos(e);if(Math.hypot(p.x-540,p.y-620)>280)return;dragging=true;last=p;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=pos(e);user.dx+=p.x-last.x;user.dy+=p.y-last.y;last=p;draw()});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>dragging=false);
document.getElementById('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return status('একটি ছবি নির্বাচন করুন।');const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{user.img=im;user.dx=user.dy=0;user.zoom=1;document.getElementById('zoom').value=1;draw();URL.revokeObjectURL(url);status('ছবি যোগ হয়েছে।')};im.onerror=()=>{URL.revokeObjectURL(url);status('ছবি খোলা যায়নি।')};im.src=url});for(const [id,key] of [['zoom','zoom'],['brightness','bright'],['contrast','contrast']])document.getElementById(id).addEventListener('input',e=>{user[key]=+e.target.value;draw()});document.getElementById('recenter').onclick=()=>{user.dx=user.dy=0;draw()};document.getElementById('reset').onclick=()=>{user.zoom=1;user.dx=user.dy=0;user.bright=user.contrast=100;for(const id of ['zoom','brightness','contrast'])document.getElementById(id).value=id==='zoom'?1:100;draw()};document.getElementById('download').onclick=()=>{if(!user.img)return status('আগে নিজের ছবি আপলোড করুন।');const a=document.createElement('a');a.download='december-profile-card.png';a.href=canvas.toDataURL('image/png');a.click();status('কার্ড ডাউনলোড হয়েছে।')};document.fonts.ready.then(draw);draw();
</script></body></html>
